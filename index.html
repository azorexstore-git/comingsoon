  <meta name="description" content="Something new is on the way. Stay tuned.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f5f5f5; background: linear-gradient(135deg, #1e1b4b, #312e81 50%, #0f172a) fixed;
    }
    a { color: #c7d2fe; }
    a:hover { color: #fff; }
    :focus-visible { outline: 2px solid #a5b4fc; outline-offset: 3px; border-radius: 3px; }
    .site-footer { margin-top: auto; padding: 28px 24px 32px; text-align: center;
      border-top: 1px solid rgba(165,180,252,.2); background: rgba(15,23,42,.35); }
    .site-footer ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px;
      max-width: 52rem; margin: 0 auto 16px; }
    .site-footer a { font-size: .92rem; text-decoration: none; opacity: .85; }
    .site-footer a:hover, .site-footer a[aria-current] { opacity: 1; text-decoration: underline; }
    .site-footer small { display: block; font-size: .8rem; opacity: .6; }

    body { text-align: center; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    h1 { font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -0.02em; margin-bottom: 16px; }
    main p { font-size: clamp(1rem, 2.5vw, 1.25rem); opacity: 0.8; max-width: 32rem; margin: 0 auto; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           background: #a5b4fc; margin-top: 32px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; opacity: .8; } }
  </style>
</head>
