<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <meta name="description" content="Something new is on the way. Stay tuned.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #f5f5f5;
      background: linear-gradient(135deg, #1e1b4b, #312e81 50%, #0f172a);
    }
    h1 { font-size: clamp(2.2rem, 7vw, 4rem); letter-spacing: -0.02em; margin-bottom: 16px; }
    p { font-size: clamp(1rem, 2.5vw, 1.25rem); opacity: 0.8; max-width: 32rem; margin: 0 auto; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
           background: #a5b4fc; margin-top: 32px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }
  </style>
</head>
<body>
  <main>
    <h1>Coming Soon</h1>
    <p>We're working on something new. Check back shortly.</p>
    <span class="dot" aria-hidden="true"></span>
  </main>
</body>
</html>
